syntax = "proto3";

package messages;

import "models/game.proto";
import "models/common.proto";
import "google/protobuf/struct.proto";

option go_package = "middle-east-im-server/pkg/pb/messages";

// 创建游戏桌请求
message CreateTableRequest {
  string game_id = 1;
  google.protobuf.Struct config = 2;
}

// 加入游戏桌请求
message JoinTableRequest {
  string table_id = 1;
}
