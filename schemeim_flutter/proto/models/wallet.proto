syntax = "proto3";

package models;

import "google/protobuf/timestamp.proto";

option go_package = "middle-east-im-server/pkg/pb/models";

// 用户钱包
message Wallet {
  string user_id = 1;
  int64 coins = 2;
  int64 diamonds = 3;
  google.protobuf.Timestamp updated_at = 4;
}

// 礼物
message Gift {
  string id = 1;
  string name = 2;
  int64 price_diamonds = 3;
  string icon_url = 4;
  string animation_url = 5;
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp updated_at = 7;
}

// 交易记录
message Transaction {
  string id = 1;
  string user_id = 2;
  string type = 3;
  int64 amount = 4;
  string currency = 5;
  string related_id = 6;
  google.protobuf.Timestamp created_at = 7;
}
