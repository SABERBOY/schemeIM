syntax = "proto3";

package models;

import "google/protobuf/timestamp.proto";

option go_package = "middle-east-im-server/pkg/pb/models";

// 用户模型
message User {
  string id = 1;
  string phone_number = 2;
  string display_name = 3;
  string avatar_url = 4;
  string frame_url = 5;
  int64 gold_balance = 6;
  int32 level = 7;
  bool is_verified = 8;
  string rank_name = 9;
  string rank_color_hex = 10;
  google.protobuf.Timestamp created_at = 11;
  google.protobuf.Timestamp updated_at = 12;
}
